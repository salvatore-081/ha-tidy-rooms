[project]
name = "tidy-rooms"
version = "0.4.2"
description = "Home Assistant integration: clean each room when it is empty, with daily targets per room."
requires-python = ">=3.14"
license = "MIT"

[dependency-groups]
dev = ["pytest-homeassistant-custom-component==0.13.375"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py314"
